<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        #map {
            width: 1075px;
            height: 1211px;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="data/Module1_CSV1_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[22.254575264609926,113.913894653331],[22.30107673735302,113.95516519117496]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OPM100_2025_0');
        map.getPane('pane_OPM100_2025_0').style.zIndex = 400;
        var img_OPM100_2025_0 = 'data/OPM100_2025_0.png';
        var img_bounds_OPM100_2025_0 = [[22.076205181083964,113.75167100210537],[22.624727555473488,114.51155829843452]];
        var layer_OPM100_2025_0 = new L.imageOverlay(img_OPM100_2025_0,
                                              img_bounds_OPM100_2025_0,
                                              {pane: 'pane_OPM100_2025_0'});
        bounds_group.addLayer(layer_OPM100_2025_0);
        map.addLayer(layer_OPM100_2025_0);
        function pop_Module1_CSV1_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Photo ID</th>\
                        <td>' + (feature.properties['Photo ID'] !== null ? autolinker.link(String(feature.properties['Photo ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Place/Subject information</th>\
                        <td>' + (feature.properties['Place/Subject information'] !== null ? autolinker.link(String(feature.properties['Place/Subject information']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Photo path</th>\
                        <td>' + (feature.properties['Photo path'] !== null ? '<img src="images/' + String(feature.properties['Photo path']).replace(/[\\/:]/g, '_').trim().replace(/'/g, '\'').replace(/"/g, '&quot;') + '">' : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Location information (Latitude)</th>\
                        <td>' + (feature.properties['Location information (Latitude)'] !== null ? autolinker.link(String(feature.properties['Location information (Latitude)']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Location information (Longtitude)</th>\
                        <td>' + (feature.properties['Location information (Longtitude)'] !== null ? autolinker.link(String(feature.properties['Location information (Longtitude)']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Locationprecision/uncertainty</th>\
                        <td>' + (feature.properties['Locationprecision/uncertainty'] !== null ? autolinker.link(String(feature.properties['Locationprecision/uncertainty']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Module1_CSV1_1_0() {
            return {
                pane: 'pane_Module1_CSV1_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(243,166,178,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Module1_CSV1_1');
        map.getPane('pane_Module1_CSV1_1').style.zIndex = 401;
        map.getPane('pane_Module1_CSV1_1').style['mix-blend-mode'] = 'normal';
        var layer_Module1_CSV1_1 = new L.geoJson(json_Module1_CSV1_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Module1_CSV1_1',
            layerName: 'layer_Module1_CSV1_1',
            pane: 'pane_Module1_CSV1_1',
            onEachFeature: pop_Module1_CSV1_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Module1_CSV1_1_0(feature));
            },
        });
        var cluster_Module1_CSV1_1 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_Module1_CSV1_1.addLayer(layer_Module1_CSV1_1);

        bounds_group.addLayer(layer_Module1_CSV1_1);
        cluster_Module1_CSV1_1.addTo(map);
        map.createPane('pane_1975HongKongKowloonandtheNewterritoriesHM20C_2');
        map.getPane('pane_1975HongKongKowloonandtheNewterritoriesHM20C_2').style.zIndex = 402;
        var img_1975HongKongKowloonandtheNewterritoriesHM20C_2 = 'data/1975HongKongKowloonandtheNewterritoriesHM20C_2.png';
        var img_bounds_1975HongKongKowloonandtheNewterritoriesHM20C_2 = [[22.273552275301654,113.93410534183268],[22.289516885939108,113.94561118534466]];
        var layer_1975HongKongKowloonandtheNewterritoriesHM20C_2 = new L.imageOverlay(img_1975HongKongKowloonandtheNewterritoriesHM20C_2,
                                              img_bounds_1975HongKongKowloonandtheNewterritoriesHM20C_2,
                                              {pane: 'pane_1975HongKongKowloonandtheNewterritoriesHM20C_2'});
        bounds_group.addLayer(layer_1975HongKongKowloonandtheNewterritoriesHM20C_2);
        map.addLayer(layer_1975HongKongKowloonandtheNewterritoriesHM20C_2);
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>
    </body>
</html>
